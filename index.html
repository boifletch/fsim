<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fsim — Interactive fire</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b10;color:#e7e2d9;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.hud{position:fixed;top:18px;left:20px;pointer-events:none;user-select:none}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#aaa;line-height:1.6}button{pointer-events:auto;margin-top:12px;border:1px solid #555;border-radius:6px;padding:7px 13px;background:#191b22;color:inherit;cursor:pointer}
</style>
<script src="fsim.js" defer></script>
</head>
<body>
<canvas id="fire" aria-label="Interactive fire simulation. Drag logs to move them."></canvas>
<div class="hud"><h1>fsim</h1><p>Drag logs together to feed the fire.<br>Separate them to slow its spread.<br>Orange = burning · darker = charred</p><button id="reset" type="button">Reset fire</button></div>
</body>
</html>
