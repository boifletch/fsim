<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fsim — Idle fire</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b10;color:#e7e2d9;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.hud{position:fixed;top:14px;left:16px;right:16px;pointer-events:none;user-select:none}h1{font-size:18px;margin:0 0 4px}p{margin:0;color:#aaa;line-height:1.45;font-size:12px}.stats{margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;font-size:16px;font-weight:600}.stat span{display:block;color:#e7e2d9}.stat small{display:block;font-weight:400;color:#aaa;font-size:11px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}button,.toggle,.settings{pointer-events:auto}.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#e7e2d9}.toggle input{margin:0}button{border:1px solid #555;border-radius:6px;padding:7px 12px;background:#191b22;color:inherit;cursor:pointer;font-size:13px}.settings{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;max-width:980px}.settings label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#aaa}.settings input{width:140px;border:1px solid #555;border-radius:6px;padding:5px 7px;background:#191b22;color:#e7e2d9;font:13px system-ui,sans-serif}
</style>
<script src="fsim.js" defer></script>
</head>
<body>
<canvas id="fire" aria-label="Interactive fire simulation. Drag logs to move them."></canvas>
<div class="hud"><h1>fsim</h1><p>Drag logs together to feed the fire.</p><div class="stats"><div class="stat"><span id="score">0</span><small>score</small></div><div class="stat"><span id="income">1.80 / sec</span><small>income</small></div><div class="stat"><span id="fan-multiplier">1.00x</span><small>fan</small></div><div class="stat"><span id="inventory">5 / 5</span><small>temp logs available</small></div><div class="stat"><span id="fps">60</span><small>fps</small></div></div><div class="controls"><button id="add-log" type="button">Add log</button><button id="reset" type="button">Reset fire</button><label class="toggle"><input id="show-debug" type="checkbox">Debug</label></div><div class="settings"><label>Base log output<input id="base-log-output" type="number" min="0" step="0.1" value="1.8"></label><label>Maximum fan multiplier<input id="fan-max-multiplier" type="number" min="1" step="0.1" value="3"></label><label>Fan multiplier decay<input id="fan-decay" type="number" min="0" step="0.1" value="3"></label><label>Cell burn rate decay<input id="cell-burn-decay" type="number" min="0" step="0.1" value="1.5"></label><label>Log cell fuel consumption rate<input id="fuel-consumption-rate" type="number" min="0" step="0.001" value="0.01"></label><label>Fan influence area<input id="fan-influence-area" type="number" min="1" step="0.5" value="6"></label></div></div>
</body>
</html>
