<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>psim - particle sim</title>

    <script src="psim.js" defer></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        background-color: black;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        width: min(100vw, 100vh);
        width: min(100vw, 100dvh);
        height: min(100vw, 100vh);
        height: min(100vw, 100dvh);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="environment"></canvas>
  </body>
</html>
